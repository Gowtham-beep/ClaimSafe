app = "claimsafe-frontend"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    VITE_API_URL = "https://claimsafe-api.fly.dev"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]
